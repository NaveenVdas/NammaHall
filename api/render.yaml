services:
  - type: web
    name: nammahall-api
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DatabaseProvider
        value: PostgreSQL
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: AllowedOrigins
        sync: false  # Set this manually in Render dashboard
    healthCheckPath: /healthz

databases:
  - name: nammahall-db
    databaseName: nammahall
    user: nammahall
    plan: free

